# Answer-quality validation for label-free routed conditional-pair Ours.
# The four paired 600-token HotpotQA baselines already exist in
# hotpot_600_vs_ours_200_llm, so only Ours incurs new API calls.
name: routed_pair_hotpot_200_llm
dataset: data/raw/hotpot_dev_distractor_v1.json
n_questions: 200
seed: 0
call_llm: true
llm_model: gpt-4o-mini
include_candidates: false
methods:
  - name: ours_routed_pair_200
    kind: selective_graph
    max_hops: 2
    use_reranker: true
    graph_rel_method: ppr
    conditional_rerank: true
    conditional_anchor_n: 1
    strategy: routed_topk
    conditional_weight: 0.30
    alpha: 1.0
    budget_tokens: 200
