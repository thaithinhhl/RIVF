# Finer local search around the best region found by alpha_budget_search.yaml
# (budget=600, alpha=0.6 had the largest margin over baselines) -- the first
# grid stepped by 100 tokens / 0.2 alpha, coarse enough to miss a nearby
# sharper peak. No LLM needed.
name: alpha_budget_search_v2
n_questions: 200
seed: 0
call_llm: false
include_candidates: false
methods:
  - name: dense_rag
    kind: dense_rag
    budget_tokens: [500, 550, 600, 650, 700]
  - name: fixed_1hop
    kind: fixed_hop
    hops: 1
    budget_tokens: [500, 550, 600, 650, 700]
  - name: fixed_2hop
    kind: fixed_hop
    hops: 2
    budget_tokens: [500, 550, 600, 650, 700]
  - name: ours
    kind: selective_graph
    max_hops: 2
    alpha: [0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8]
    budget_tokens: [500, 550, 600, 650, 700]
