# Experiment 4: semantic-only / graph-only / random-pruning-sanity-check /
# full-method, plus the alpha-sensitivity sweep -- all at a fixed 300-token
# budget so they're comparable to each other and to main_comparison.yaml.
name: ablation
n_questions: 200
seed: 0
call_llm: false
methods:
  - name: semantic_only
    kind: selective_graph
    max_hops: 2
    alpha: 1.0
    budget_tokens: 300
  - name: graph_only
    kind: selective_graph
    max_hops: 2
    alpha: 0.0
    budget_tokens: 300
  - name: random_pruning
    kind: selective_graph
    max_hops: 2
    strategy: random
    budget_tokens: 300
  - name: full_method_alpha_sweep
    kind: selective_graph
    max_hops: 2
    alpha: [0.0, 0.25, 0.5, 0.75, 1.0]
    budget_tokens: 300
