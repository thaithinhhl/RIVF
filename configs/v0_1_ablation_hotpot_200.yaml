name: rq4_ablation_hotpot_n200
output_root: result_v0.1
dataset: data/raw/hotpot_dev_distractor_v1.json
n_questions: 200
seed: 0
stratified_sampling: true
call_llm: true
llm_model: gpt-4o-mini
include_candidates: false
methods:
  - &ours_no_graph
    name: -GraphScore
    kind: selective_graph
    max_hops: 2
    use_reranker: true
    graph_rel_method: ppr
    query_weighted_ppr: true
    ppr_seed_temperature: 0.20
    strategy: routed_graph_rescue
    bridge_policy: single_chain
    conditional_rerank: true
    conditional_anchor_n: 2
    conditional_weight: 0.30
    graph_rescue_weight: 0.0
    graph_rescue_k: 6
    alpha: 1.0
    coverage_bonus: 0.20
    budget_tokens: 200
  - <<: *ours_no_graph
    name: Uniform PPR
    query_weighted_ppr: false
    graph_rescue_weight: 0.20
  - <<: *ours_no_graph
    name: -DisagreementGate
    graph_rescue_weight: 0.20
    graph_rescue_gate: false
  - <<: *ours_no_graph
    name: -Router
    strategy: graph_rescue_topk
    graph_rescue_weight: 0.20
  - <<: *ours_no_graph
    name: -ConditionalScoring
    conditional_rerank: false
    graph_rescue_weight: 0.20
  - <<: *ours_no_graph
    name: -PairPreservation
    graph_rescue_weight: 0.20
    preserve_pairs: false
  - <<: *ours_no_graph
    name: Graph-only
    strategy: normalized_topk
    conditional_rerank: false
    graph_rescue_weight: 0.0
    alpha: 0.0
