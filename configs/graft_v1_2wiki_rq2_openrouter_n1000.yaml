# RQ2 same-budget baselines on the exact 1,000 paired 2Wiki RQ1 QIDs.
# GRAFT-200 is reused from graft_v1_2wiki_rq1_openrouter_n1000.
name: graft_v1_2wiki_rq2_openrouter_n1000
dataset: data/raw/2wikimultihopqa_dev.json
qid_manifest: data/manifests/2wiki_graft_v1_evaluation.json
n_questions: 1000
seed: 0
stratified_sampling: true
deduplicate_passages: true
invalid_gold_policy: exclude
backend: openrouter
embedding_model: baai/bge-m3
reranker_model: qwen/qwen3-reranker-8b
call_llm: true
llm_model: openai/gpt-4o-mini-2024-07-18
llm_concurrency: 5
include_candidates: false
methods:
  - name: Dense RAG
    kind: dense_rag
    use_reranker: true
    budget_tokens: 200
  - name: Graph 1-hop
    kind: fixed_hop
    hops: 1
    use_reranker: true
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    budget_tokens: 200
  - name: Graph 2-hop
    kind: fixed_hop
    hops: 2
    use_reranker: true
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    budget_tokens: 200
