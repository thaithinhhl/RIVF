# Full HotpotQA dev-distractor retrieval evaluation. This is intentionally an
# asymmetric compression comparison: baselines may use 600 evidence tokens;
# Ours is hard-capped at 200. Enable call_llm only with an explicit cost plan.
name: final_hotpot_full_retrieval
dataset: data/raw/hotpot_dev_distractor_v1.json
n_questions: 7405
seed: 0
call_llm: false
include_candidates: false
methods:
  - name: dense_bi_600
    kind: dense_rag
    budget_tokens: 600
  - name: dense_ce_600
    kind: dense_rag
    use_reranker: true
    budget_tokens: 600
  - name: graph_1hop_ce_600
    kind: fixed_hop
    hops: 1
    use_reranker: true
    budget_tokens: 600
  - name: graph_2hop_ce_600
    kind: fixed_hop
    hops: 2
    use_reranker: true
    budget_tokens: 600
  - name: ours_qa_200
    kind: selective_graph
    max_hops: 2
    use_reranker: true
    graph_rel_method: ppr
    conditional_rerank: true
    conditional_anchor_n: 1
    bridge_policy: single_chain
    strategy: routed_topk
    conditional_weight: 0.30
    alpha: 1.0
    budget_tokens: 200
