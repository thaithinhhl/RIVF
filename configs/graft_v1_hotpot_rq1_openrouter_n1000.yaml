# RQ1 main table on 1,000 paired HotpotQA evaluation QIDs.
# One OpenRouter key serves embeddings, reranking and answer generation.
name: graft_v1_hotpot_rq1_openrouter_n1000
dataset: data/raw/hotpot_dev_distractor_v1.json
qid_manifest: data/manifests/hotpot_graft_v1_evaluation.json
n_questions: 1000
seed: 0
stratified_sampling: true
deduplicate_passages: true
invalid_gold_policy: exclude
backend: openrouter
embedding_model: baai/bge-m3
reranker_model: qwen/qwen3-reranker-8b
call_llm: true
llm_model: openai/gpt-4o-mini-2024-07-18
llm_concurrency: 5
include_candidates: false
methods:
  - name: Dense RAG
    kind: dense_rag
    use_reranker: true
    budget_tokens: 600
  - name: Graph 1-hop
    kind: fixed_hop
    hops: 1
    use_reranker: true
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    budget_tokens: 600
  - name: Graph 2-hop
    kind: fixed_hop
    hops: 2
    use_reranker: true
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    budget_tokens: 600
  - name: GRAFT
    kind: selective_graph
    max_hops: 2
    use_reranker: true
    graph_rel_method: hop
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    strategy: graft
    conditional_rerank: true
    conditional_anchor_n: 2
    conditional_link_top_l: 2
    conditional_weight: 0.30
    preserve_pairs: true
    alpha: 1.0
    coverage_bonus: 0.0
    budget_tokens: [600, 200]
