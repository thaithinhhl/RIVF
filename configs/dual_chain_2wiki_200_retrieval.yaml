    bridge_policy: dual_chain
    strategy: routed_topk
    conditional_weight: 0.20
    alpha: 1.0
    budget_tokens: 200
  - name: routed_dual_w030
    kind: selective_graph
    max_hops: 2
    use_reranker: true
