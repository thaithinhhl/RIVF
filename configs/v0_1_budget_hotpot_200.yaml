name: rq1_rq2_rq3_hotpot_n200
output_root: result_v0.1
dataset: data/raw/hotpot_dev_distractor_v1.json
n_questions: 200
seed: 0
stratified_sampling: true
call_llm: true
llm_model: gpt-4o-mini
include_candidates: false
methods:
  - name: Dense CE
    kind: dense_rag
    use_reranker: true
    budget_tokens: [100, 150, 200, 300, 400, 600]
  - name: Graph 1-hop CE
    kind: fixed_hop
    hops: 1
    use_reranker: true
    budget_tokens: [100, 150, 200, 300, 400, 600]
  - name: Graph 2-hop CE
    kind: fixed_hop
    hops: 2
    use_reranker: true
    budget_tokens: [100, 150, 200, 300, 400, 600]
  - name: Ours v2
    kind: selective_graph
    max_hops: 2
    use_reranker: true
    graph_rel_method: ppr
    query_weighted_ppr: true
    ppr_seed_temperature: 0.20
    strategy: routed_graph_rescue
    bridge_policy: single_chain
    conditional_rerank: true
    conditional_anchor_n: 2
    conditional_weight: 0.30
    graph_rescue_weight: 0.20
    graph_rescue_k: 6
    graph_rescue_gate: true
    preserve_pairs: true
    alpha: 1.0
    coverage_bonus: 0.20
    budget_tokens: [100, 150, 200, 300, 400, 600]
