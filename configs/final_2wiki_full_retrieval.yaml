# Canonical GRAFT-v1 retrieval run on the untouched 2Wiki holdout.
name: graft_v1_2wiki_main_retrieval
dataset: data/raw/2wikimultihopqa_dev.json
qid_manifest: data/manifests/2wiki_graft_v1_evaluation.json
n_questions: 12108
seed: 0
stratified_sampling: true
deduplicate_passages: true
invalid_gold_policy: exclude
call_llm: false
include_candidates: false
methods:
  - name: Dense RAG
    kind: dense_rag
    use_reranker: true
    budget_tokens: [200, 600]
  - name: Graph 1-hop
    kind: fixed_hop
    hops: 1
    use_reranker: true
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    budget_tokens: [200, 600]
  - name: Graph 2-hop
    kind: fixed_hop
    hops: 2
    use_reranker: true
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    budget_tokens: [200, 600]
  - name: GRAFT
    kind: selective_graph
    max_hops: 2
    use_reranker: true
    graph_rel_method: hop
    graph_edge_types: [same_passage, entity_overlap, title_mention]
    strategy: graft
    conditional_rerank: true
    conditional_anchor_n: 2
    conditional_link_top_l: 2
    conditional_weight: 0.30
    preserve_pairs: true
    alpha: 1.0
    coverage_bonus: 0.0
    budget_tokens: 200
