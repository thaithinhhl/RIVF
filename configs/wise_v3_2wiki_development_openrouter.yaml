# Development-only WISE-v3 screen. Planner and structured verifier calls are
# required even when downstream answer generation is disabled.
name: wise_v3_2wiki_development_openrouter
dataset: data/raw/2wikimultihopqa_dev.json
qid_manifest: data/manifests/2wiki_graft_v1_development.json
n_questions: 398
seed: 0
stratified_sampling: true
deduplicate_passages: true
invalid_gold_policy: exclude
backend: openrouter
embedding_model: baai/bge-m3
reranker_model: qwen/qwen3-reranker-8b
llm_model: openai/gpt-4o-mini-2024-07-18
call_llm: false
include_candidates: true
methods:
  - name: WISE-v3
    kind: wise_v3
    use_reranker: true
    planner_backend: openrouter
    planner_model: openai/gpt-4o-mini-2024-07-18
    verifier_backend: openrouter
    verifier_model: openai/gpt-4o-mini-2024-07-18
    seed_n: 5
    max_hops: 2
    claim_support_threshold: 0.7
    claim_top_k: 5
    claim_prefilter_k: 8
    dependency_threshold: 0.7
    max_path_hops: 3
    dependency_path_top_k: 3
    confidence_temperature: 1.0
    witness_sufficiency_threshold: 0.8
    max_search_states: 100000
    budget_tokens: 200
